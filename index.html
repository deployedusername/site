<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поддержать проект</title>
    <style>
        :root {
            --da-orange: #f57c00;
            --da-orange-hover: #ff9800;
            --bg-dark: #121417;
            --card-bg: #1c1f24;
            --card-border: #2c323b;
            --text-main: #ffffff;
            --text-muted: #9ba3af;
            --tg-color: #229ed9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        }

        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--da-orange), #ff5722);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(245, 124, 0, 0.4);
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .links-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .widget-btn {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
        }

        .widget-btn:hover {
            transform: translateY(-2px);
        }

        .widget-btn svg {
            width: 26px;
            height: 26px;
            margin-right: 14px;
            flex-shrink: 0;
            fill: currentColor;
        }

        /* Кнопка DonationAlerts */
        .btn-da {
            background-color: var(--da-orange);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(245, 124, 0, 0.3);
        }

        .btn-da:hover {
            background-color: var(--da-orange-hover);
            box-shadow: 0 6px 18px rgba(245, 124, 0, 0.45);
        }

        /* Кнопка Telegram */
        .btn-tg {
            background-color: rgba(34, 158, 217, 0.1);
            color: #ffffff;
            border: 1px solid rgba(34, 158, 217, 0.3);
        }

        .btn-tg:hover {
            background-color: rgba(34, 158, 217, 0.2);
            border-color: var(--tg-color);
            box-shadow: 0 4px 14px rgba(34, 158, 217, 0.25);
        }

        .btn-tg svg {
            fill: var(--tg-color);
        }

        .btn-text {
            text-align: left;
            display: flex;
            flex-direction: column;
        }

        .btn-text span.small {
            font-size: 11px;
            font-weight: 400;
            opacity: 0.8;
            margin-top: 1px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="avatar">⚡</div>
    <h1>Поддержать проект</h1>
    <p class="subtitle">Выберите удобный способ связи или поддержки</p>

    <div class="links-group">
        <!-- Кнопка DonationAlerts -->
        <a href="https://dalink.to/deployedyourself" target="_blank" rel="noopener noreferrer" class="widget-btn btn-da">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/>
            </svg>
            <div class="btn-text">
                <span>DonationAlerts</span>
                <span class="small">Отправить донат через DALink</span>
            </div>
        </a>

        <!-- Кнопка Telegram -->
        <a href="https://t.me" target="_blank" rel="noopener noreferrer" class="widget-btn btn-tg">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.52 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .37z"/>
            </svg>
            <div class="btn-text">
                <span>Telegram</span>
                <span class="small">@anonymnoekazino</span>
            </div>
        </a>
    </div>
</div>

</body>
</html>
